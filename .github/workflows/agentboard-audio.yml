# Builds of the audio branch for AgentBoard (the board downloads them on demand) until the audio
# redirection is part of an upstream release. A tag audio-v* builds every platform and attaches
# one gzip file per platform to the GitHub release of that tag.
name: AgentBoard audio builds

on:
  push:
    tags: ['audio-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agent-rdp-linux-x64.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: agent-rdp-linux-arm64.gz
    runs-on: ${{ matrix.runner }}
    # glibc 2.35, as upstream builds (#70)
    container:
      image: ubuntu:22.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config cmake
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release -p agent-rdp --target ${{ matrix.target }}
          gzip -9 -c target/${{ matrix.target }}/release/agent-rdp > ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agent-rdp-win32-x64.exe.gz
            exe: agent-rdp.exe
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: agent-rdp-darwin-arm64.gz
            exe: agent-rdp
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: agent-rdp-darwin-x64.gz
            exe: agent-rdp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --release -p agent-rdp --target ${{ matrix.target }}
          gzip -9 -c target/${{ matrix.target }}/release/${{ matrix.exe }} > ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [build-linux, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum *.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body: Builds of the audio branch for AgentBoard (sound out, microphone in over IPC).
